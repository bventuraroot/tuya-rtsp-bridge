name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax
        run: python -m py_compile src/*.py tests/test_i18n.py tests/test_paths.py
      - name: i18n keys
        run: python tests/test_i18n.py
      - name: path helpers
        run: python tests/test_paths.py
